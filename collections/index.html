<title>All Stories — Sound Signal</title>

<!-- Collection index ("all stories →" overflow target from the homepage nav).
     Thin full-page grid of every Live collection. Standalone, on V3 tokens. -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />

<style>
  :root {
    --page:#f1ede2; --surface:#f6f2e6; --surface-warm:#e9e3d2;
    --ink:#15171a; --ink-mid:#3a3d44; --ink-light:#7a7d85; --ink-faint:#b6b8be;
    --rule:#d4cfbe; --accent:#1d3a8a; --on-accent:#f6f2e6; --ember:#E5573B;
    --hi-vis-yellow:#EBEC68; --lime:#97C617;
    --f-sans:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    --f-display:'Inter Tight','Inter',sans-serif;
    --f-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;
    --r-chip:2px; --r-button:3px; --r-card:4px; --slice-pad:clamp(20px,5vw,70px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page); color: var(--ink-mid); font-family: var(--f-sans); font-size: 15px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }

  .slice-masthead { background: var(--accent); color: var(--on-accent); position: sticky; top: 0; z-index: 50; isolation: isolate; overflow: hidden; }
  .slice-masthead::before {
    content:""; position:absolute; inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><g fill='%23C8E891' fill-opacity='0.95'><rect x='17' y='6' width='2' height='24'/><rect x='6' y='17' width='24' height='2'/><circle cx='18' cy='18' r='2.2'/></g></svg>");
    background-size:36px 36px; background-position:center; opacity:0.38;
    -webkit-mask-image:radial-gradient(ellipse 26% 70% at 58% 50%,#000 0%,#000 35%,transparent 85%),radial-gradient(ellipse 14% 55% at 84% 50%,#000 0%,#000 30%,transparent 85%);
    mask-image:radial-gradient(ellipse 26% 70% at 58% 50%,#000 0%,#000 35%,transparent 85%),radial-gradient(ellipse 14% 55% at 84% 50%,#000 0%,#000 30%,transparent 85%);
    mask-composite:add; pointer-events:none; z-index:0;
  }
  .masthead-inner { padding:16px var(--slice-pad); display:grid; grid-template-columns:auto 1fr auto; column-gap:24px; align-items:center; position:relative; z-index:1; }
  .brand { display:flex; align-items:center; gap:18px; }
  .ss-dots { display:flex; flex-direction:column; gap:6px; }
  .ss-dots i { width:11px; height:11px; border-radius:50%; display:block; }
  .ss-dots i:nth-child(1){background:var(--ember);} .ss-dots i:nth-child(2){background:var(--hi-vis-yellow);}
  .ss-dots i:nth-child(3){background:var(--lime);} .ss-dots i:nth-child(4){background:var(--on-accent);}
  .ss-wordmark { font-family:var(--f-display); font-weight:500; font-size:56px; line-height:1; letter-spacing:-0.045em; color:var(--on-accent); white-space:nowrap; }
  .tagline { font-family:var(--f-mono); font-weight:400; font-size:11px; letter-spacing:0.04em; line-height:1.3; text-transform:uppercase; color:color-mix(in oklab,var(--on-accent) 75%,transparent); max-width:22ch; align-self:center; }
  .masthead-actions { justify-self:end; }
  .nav-about { font-family:var(--f-mono); font-weight:700; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; display:inline-block; padding:8px 18px; background:var(--on-accent); color:var(--ink); border:1.5px solid var(--on-accent); border-radius:var(--r-button); }

  .index-wrap { max-width:1240px; margin:0 auto; padding:30px var(--slice-pad) 0; }
  .kicker { font-family:var(--f-mono); font-weight:700; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; display:inline-block; padding:6px 12px; background:var(--accent); color:var(--on-accent); border-radius:var(--r-chip); }
  .index-title { font-family:var(--f-display); font-weight:500; font-size:clamp(28px,3.4vw,42px); line-height:1.05; letter-spacing:-0.03em; color:var(--ink); margin:14px 0 4px; }
  .index-sub { font-family:var(--f-mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-light); border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:24px; }
  .index-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .side-card { display:block; position:relative; }
  .side-card-img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:var(--r-card); display:block; background:var(--surface-warm); }
  .badge { position:absolute; top:10px; left:10px; font-family:var(--f-mono); font-weight:700; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:4px 9px; border-radius:var(--r-chip); background:var(--ember); color:#fff; }
  .side-card-name { font-family:var(--f-display); font-weight:500; font-size:18px; line-height:1.15; letter-spacing:-0.02em; color:var(--ink); margin:9px 0 3px; }
  .side-card-count { font-family:var(--f-mono); font-weight:700; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); }
  .related-note { font-family:var(--f-mono); color:var(--ink-light); }

  .slice-footer { background:var(--accent); color:var(--on-accent); margin-top:52px; }
  .footer-inner { padding:16px var(--slice-pad); display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap; }
  .pub { font-family:var(--f-mono); font-weight:400; font-size:11px; letter-spacing:0.04em; }
  .pub .brand-mark { text-transform:lowercase; opacity:0.85; } .pub .org { font-weight:700; }
  .foot-right { font-family:var(--f-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.6; }

  @media (max-width:960px){ .index-grid{ grid-template-columns:repeat(2,1fr);} .ss-wordmark{font-size:40px;} .tagline{display:none;} }
  @media (max-width:560px){ .index-grid{ grid-template-columns:1fr;} }
</style>
</head>
